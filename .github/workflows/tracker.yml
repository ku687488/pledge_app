name: Apex 24H Background Tracker

on:
  schedule:
    # 每個營業日（周一至周五）台北時間下午 5:00 (UTC 9:00) 自動運行
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy

      - name: Run Tracker
        run: |
          python tracker.py

      - name: Commit and Push Log (Auto-Save to GitHub)
        run: |
          git config --global user.name "Apex-Bot"
          git config --global user.email "bot@apex.local"
          git add market_log.csv
          git commit -m "Auto-update market log [skip ci]" || exit 0
          git push
